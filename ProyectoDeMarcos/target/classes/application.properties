spring.application.name=RDMProject
# Mantenemos el puerto 8090 que ya sabemos que funciona
server.port=8090

# --- CONFIGURACION DE MYSQL ---
# CREAR la base de datos "floreria" si no existe
spring.datasource.url=jdbc:mysql://localhost:3306/floreria?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- CONFIGURACION JPA (Para crear tablas automaticas) ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

## --CONFIGURACION PARA JWT SEGURIDAD
jwt.secret=MiClaveSuperLargaQueDebeTenerAlMenos32Bytes_O_256bits_+_aleatoria
jwt.expiration-ms=3600000
##DESACTIVAR EL THYMELEAD CACHE PARA VER MAS RAPIDO LOS CAMBIOS
spring.thymeleaf.cache=false
##debug
logging.level.org.springframework.security=DEBUG
logging.level.com.example.RDMProject=DEBUG