spring.application.name=RDMProject
# Mantenemos el puerto 8090 que ya sabemos que funciona
server.port=8090

# --- CONFIGURACIÓN DE MYSQL ---
# Esto creará la base de datos "floreria" si no existe
spring.datasource.url=jdbc:mysql://localhost:3306/floreria?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- CONFIGURACIÓN JPA (Para crear tablas automáticas) ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect