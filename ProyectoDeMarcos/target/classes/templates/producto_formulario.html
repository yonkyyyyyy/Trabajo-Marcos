<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuevo Producto - Florería RDM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light">

    <nav class="navbar navbar-dark" style="background-color: #2b2d3d;">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="bi bi-arrow-left-circle me-2"></i> Volver al Inicio
            </a>
            <span class="navbar-text text-white">Panel de Administración</span>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                
                <div class="card shadow rounded-4 border-0">
                    <div class="card-header bg-white border-bottom-0 pt-4 pb-0 text-center">
                        <h2 class="fw-bold" style="color: #2b2d3d;">Registrar Producto</h2>
                        <p class="text-muted">Ingresa los detalles del nuevo arreglo floral</p>
                    </div>
                    
                    <div class="card-body p-4">
                        <form th:action="@{/productos/guardar}" th:object="${producto}" method="post">
                            
                            <div class="mb-3">
                                <label for="nombre" class="form-label fw-bold">Nombre del Producto</label>
                                <input type="text" class="form-control rounded-3" id="nombre" th:field="*{nombre}" placeholder="Ej: Ramo de Rosas Rojas" required>
                            </div>

                            <div class="mb-3">
                                <label for="descripcion" class="form-label fw-bold">Descripción</label>
                                <textarea class="form-control rounded-3" id="descripcion" th:field="*{descripcion}" rows="3" placeholder="Detalles del arreglo..." required></textarea>
                            </div>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="precio" class="form-label fw-bold">Precio (S/)</label>
                                    <input type="number" step="0.01" class="form-control rounded-3" id="precio" th:field="*{precio}" placeholder="0.00" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="cantidad" class="form-label fw-bold">Stock Inicial</label>
                                    <input type="number" class="form-control rounded-3" id="cantidad" th:field="*{cantidad}" placeholder="0" required>
                                </div>
                            </div>

                            <div class="mb-4">
                                <label for="imagen" class="form-label fw-bold">URL de la Imagen</label>
                                <input type="text" class="form-control rounded-3" id="imagen" th:field="*{imagen}" placeholder="https://...">
                                <div class="form-text">Copia el enlace de una imagen de internet.</div>
                            </div>

                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-success btn-lg rounded-pill fw-bold">
                                    <i class="bi bi-save me-2"></i> Guardar Producto
                                </button>
                                <a href="/" class="btn btn-outline-secondary rounded-pill">Cancelar</a>
                            </div>

                        </form>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
