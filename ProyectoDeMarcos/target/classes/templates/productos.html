<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo - Florería RDM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="d-flex flex-column min-vh-100 bg-light">

<!-- Header para usuarios NO autenticados (público) -->
<div sec:authorize="isAnonymous()">
    <div th:replace="~{fragments/header-public :: header-public}"></div>
</div>

<!-- Header para usuarios con rol COMPRADOR -->
<div sec:authorize="hasRole('COMPRADOR')">
    <div th:replace="~{fragments/header-comprador :: header-comprador}"></div>
</div>

<!-- Header para usuarios con rol VENDEDOR -->
<div sec:authorize="hasRole('VENDEDOR')">
    <div th:replace="~{fragments/header-vendedor :: header-vendedor}"></div>
</div>

<!-- Header para usuarios con rol ADMIN -->
<div sec:authorize="hasRole('ADMIN')">
    <div th:replace="~{fragments/header-admin :: header-admin}"></div>
</div>

    <div class="container mt-3" th:if="${success != null}">
        <div class="alert alert-success alert-dismissible fade show shadow-sm" role="alert">
            <i class="bi bi-check-circle-fill me-2"></i>
            <span th:text="${success}">Producto agregado</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
    </div>

    <div class="container mt-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="fw-bold" style="color: #2b2d3d;">Nuestro Catálogo</h2>
            <div sec:authorize="hasRole('ADMIN')">
            <a class="btn btn-primary text-white px-4 rounded-pill shadow-sm" href="/productos/nuevo">
                <i class="bi bi-plus-lg me-2"></i> Nuevo Producto
            </a></div>
        </div>
        <hr>
    </div>


    <div class="container mb-4">
        <div class="d-flex justify-content-center gap-2 flex-wrap">
            <a href="/productos" 
               class="btn rounded-pill px-4"
               th:classappend="${categoriaActiva == null} ? 'btn-dark' : 'btn-outline-dark'">
                Todos
            </a>
            <a th:each="cat : ${categorias}" 
               th:href="@{/productos(categoriaId=${cat.idCategoria})}"
               class="btn rounded-pill px-4"
               th:classappend="${categoriaActiva == cat.idCategoria} ? 'btn-dark' : 'btn-outline-dark'"
               th:text="${cat.descripcion}">
                Categoría
            </a>
        </div>
    </div>

    <div class="container mb-5">
        
        <div class="alert alert-warning text-center" th:if="${#lists.isEmpty(listaProductos)}">
            No hay productos disponibles en esta categoría.
        </div>

        <div class="row g-4">
            <div class="col-md-6 col-lg-4 col-xl-3" th:each="producto : ${listaProductos}">
                <div class="card h-100 shadow-sm border-0 rounded-4 transition-hover">
                    
                    <div class="position-relative">
                        <img th:src="${producto.imagen != null && producto.imagen != '' ? producto.imagen : 'https://placehold.co/300x350/png?text=Sin+Imagen'}" 
                             class="card-img-top rounded-top-4" alt="Producto" style="height: 250px; object-fit: cover;">
                    </div>

                    <div class="card-body text-center d-flex flex-column">
                        <h5 class="card-title fw-bold text-dark mb-1" th:text="${producto.nombre}">Nombre</h5>
                        
                        <div class="mb-2">
                            <span class="badge rounded-pill" 
                                  th:classappend="${producto.cantidad > 5} ? 'text-bg-success' : 'text-bg-danger'"
                                  th:text="'Stock: ' + ${producto.cantidad}">
                                Stock: 10
                            </span>
                        </div>

                        <p class="text-muted small mb-2" th:text="${producto.descripcion}">Descripción...</p>
                        
                        <div class="mt-auto">
                            <h4 class="text-danger fw-bold mb-3" th:text="'S/ ' + ${producto.precio}">S/ 0.00</h4>
                            
                            <div class="d-flex gap-2">
                                <form th:action="@{/cart/add/{id}(id=${producto.id})}" method="post" class="flex-grow-1">
                                    <input type="hidden" name="cantidad" value="1" />
                                    <button type="submit" class="btn btn-outline-dark rounded-pill w-100 fw-bold">
                                        <i class="bi bi-cart-plus me-2"></i> Añadir
                                    </button>
                                </form>
                                <div sec:authorize="hasRole('ADMIN')">
                                <a th:href="@{/productos/editar/{id}(id=${producto.id})}" class="btn btn-warning rounded-pill text-white" title="Editar">
                                    <i class="bi bi-pencil-fill"></i>
                                </a>
                                <a th:href="@{/productos/eliminar/{id}(id=${producto.id})}" 
                                   class="btn btn-danger rounded-pill text-white" 
                                   onclick="return confirm('¿Estás seguro?');" 
                                   title="Eliminar">
                                    <i class="bi bi-trash-fill"></i>
                                </a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="loginModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content rounded-4 shadow">
                <div class="modal-header border-bottom-0">
                    <h1 class="modal-title fs-5 fw-bold">Iniciar Sesión</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body py-0">
                    <form>
                        <div class="form-floating mb-3">
                            <input type="email" class="form-control rounded-3" id="floatingInput" placeholder="nombre@ejemplo.com">
                            <label for="floatingInput">Correo electrónico</label>
                        </div>
                        <div class="form-floating mb-3">
                            <input type="password" class="form-control rounded-3" id="floatingPassword" placeholder="Contraseña">
                            <label for="floatingPassword">Contraseña</label>
                        </div>
                        <button class="w-100 mb-2 btn btn-lg rounded-3 btn-primary" type="submit">Ingresar</button>
                    </form>
                </div>
                <div class="modal-footer flex-column align-items-stretch w-100 gap-2 pb-3 border-top-0">
                    <button type="button" class="btn btn-lg btn-light w-100 mx-0" data-bs-dismiss="modal">Cerrar</button>
                </div>
            </div>
        </div>
    </div>

    <footer class="bg-dark text-white text-center py-3 mt-auto">
        <div class="container">
            <p class="mb-0">&copy; 2025 RDM Project</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
