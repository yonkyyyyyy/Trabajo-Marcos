<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Ventas - Florería RDM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="d-flex flex-column min-vh-100">
    
    <div sec:authorize="hasRole('ADMIN')">
        <div th:replace="~{fragments/header-admin :: header-admin}"></div>
    </div>
    <div sec:authorize="hasRole('VENDEDOR')">
        <div th:replace="~{fragments/header-vendedor :: header-vendedor}"></div>
    </div>

    <div class="container mt-4">
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="/">Inicio</a></li>
                <li class="breadcrumb-item active">Ventas</li>
            </ol>
        </nav>

        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2><i class="bi bi-cart-check text-primary me-2"></i>Gestión de Ventas</h2>
            <a href="/ventas/nueva" class="btn btn-primary">
                <i class="bi bi-plus-circle"></i> Nueva Venta
            </a>
        </div>

        <div th:if="${mensaje}" class="alert alert-success alert-dismissible fade show">
            <i class="bi bi-check-circle me-2"></i>
            <span th:text="${mensaje}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="card shadow-sm">
            <div class="card-body">
                <table class="table table-hover">
                    <thead class="table-light">
                        <tr>
                            <th>ID</th>
                            <th>Fecha</th>
                            <th>Cliente</th>
                            <th class="text-end">Total</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${#lists.isEmpty(ventas)}">
                            <td colspan="6" class="text-center">No hay ventas</td>
                        </tr>
                        <tr th:each="venta : ${ventas}">
                            <td>#[[${venta.id}]]</td>
                            <td>[[${#temporals.format(venta.fechaVenta, 'dd/MM/yyyy')}]]</td>
                            <td th:text="${venta.cliente?.nombreRazonSocial ?: 'Sin cliente'}"></td>
                            <td class="text-end">S/ [[${#numbers.formatDecimal(venta.total, 1, 2)}]]</td>
                            <td>
                                <span th:class="'badge bg-' + ${venta.estado.badgeColor}">
                                    [[${venta.estado.descripcion}]]
                                </span>
                            </td>
                            <td>
                                <a th:href="@{/ventas/{id}(id=${venta.id})}" class="btn btn-sm btn-outline-primary">
                                    <i class="bi bi-eye"></i> Ver
                                </a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
