<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Nueva Venta - Florería RDM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>

<div sec:authorize="hasRole('ADMIN')">
    <div th:replace="~{fragments/header-admin :: header-admin}"></div>
</div>
<div sec:authorize="hasRole('VENDEDOR')">
    <div th:replace="~{fragments/header-vendedor :: header-vendedor}"></div>
</div>
<div sec:authorize="hasRole('COMPRADOR')">
    <div th:replace="~{fragments/header-comprador :: header-comprador}"></div>
</div>

<div class="container mt-4">
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="/">Inicio</a></li>
            <li class="breadcrumb-item"><a href="/ventas">Ventas</a></li>
            <li class="breadcrumb-item active">
                <span th:if="${venta.id == null}">Nueva Venta</span>
                <span th:if="${venta.id != null}">Editar Venta #[[${venta.id}]]</span>
            </li>
        </ol>
    </nav>

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>
            <i class="bi bi-cart-plus text-primary me-2"></i>
            <span th:if="${venta.id == null}">Nueva Venta</span>
            <span th:if="${venta.id != null}">Editar Venta</span>
        </h2>
    </div>

    <div th:if="${error}" class="alert alert-danger alert-dismissible">
        <i class="bi bi-exclamation-triangle me-2"></i>
        <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <form th:action="@{/ventas/guardar}" method="post" th:object="${venta}">
        <input type="hidden" th:field="*{id}">
        <input type="hidden" th:field="*{usuario.idUsuario}">

        <div class="card mb-3">
            <div class="card-header bg-primary text-white">
                <i class="bi bi-person-circle me-2"></i>Información del Cliente
            </div>
            <div class="card-body">
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Cliente *</label>
                        <select class="form-select" th:field="*{cliente.id}" required>
                            <option value="">Seleccionar cliente...</option>
                            <option th:each="cliente : ${clientes}"
                                    th:value="${cliente.id}"
                                    th:text="${cliente.nombreRazonSocial}">
                            </option>
                        </select>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Fecha</label>
                        <input type="date" class="form-control" th:field="*{fechaVenta}" readonly>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Observaciones</label>
                    <textarea class="form-control" th:field="*{observaciones}" rows="2"
                              placeholder="Observaciones de la venta..."></textarea>
                </div>
            </div>
        </div>

        <div class="card mb-3">
            <div class="card-header bg-success text-white">
                <i class="bi bi-box-seam me-2"></i>Productos
            </div>
            <div class="card-body">
                <div id="productos-container">
                    <!-- Aquí se agregarán los productos dinámicamente -->
                </div>

                <button type="button" class="btn btn-outline-success" onclick="agregarProducto()">
                    <i class="bi bi-plus-circle me-2"></i>Agregar Producto
                </button>

                <div class="mt-4">
                    <h5>Seleccionar Productos:</h5>
                    <div class="row">
                        <div th:each="producto : ${productos}" class="col-md-4 mb-3">
                            <div class="card h-100">
                                <div class="card-body">
                                    <h6 class="card-title">[[${producto.nombre}]]</h6>
                                    <p class="text-muted mb-1">
                                        Stock: [[${producto.cantidad}]]
                                    </p>
                                    <p class="text-success fw-bold">
                                        S/ [[${#numbers.formatDecimal(producto.precio, 1, 2)}]]
                                    </p>
                                    <div class="input-group input-group-sm">
                                        <input type="number" class="form-control"
                                               th:id="'cant-' + ${producto.id}"
                                               min="1" th:max="${producto.cantidad}" value="1">
                                        <button type="button" class="btn btn-primary"
                                                th:data-id="${producto.id}"
                                                th:data-nombre="${producto.nombre}"
                                                th:data-precio="${producto.precio}"
                                                th:data-stock="${producto.cantidad}"
                                                onclick="agregarProductoDesdeData(this)">
                                            <i class="bi bi-plus"></i>
                                        </button>

                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="card mb-3">
            <div class="card-header bg-info text-white">
                <i class="bi bi-calculator me-2"></i>Totales
            </div>
            <div class="card-body">
                <div class="row">
                    <div class="col-md-4">
                        <label class="form-label">Subtotal</label>
                        <input type="number" class="form-control" id="subtotal"
                               th:field="*{subtotal}" step="0.01" readonly>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Descuento</label>
                        <input type="number" class="form-control" th:field="*{descuento}"
                               step="0.01" value="0.00" onchange="calcularTotal()">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">IGV (18%)</label>
                        <input type="number" class="form-control" id="igv"
                               th:field="*{igv}" step="0.01" readonly>
                    </div>
                </div>
                <div class="row mt-3">
                    <div class="col-md-12">
                        <label class="form-label">TOTAL</label>
                        <input type="number" class="form-control form-control-lg fw-bold"
                               id="total" th:field="*{total}" step="0.01" readonly>
                    </div>
                </div>
            </div>
        </div>

        <div class="d-flex gap-2 mb-4">
            <button type="submit" class="btn btn-primary btn-lg">
                <i class="bi bi-save me-2"></i>Guardar Venta
            </button>
            <a href="/ventas" class="btn btn-outline-secondary btn-lg">
                <i class="bi bi-x-circle me-2"></i>Cancelar
            </a>
        </div>
    </form>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    let productosAgregados = [];
    let contadorProductos = 0;

    function agregarProductoDesdeData(btn) {
    const id = btn.dataset.id;
    const nombre = btn.dataset.nombre;
    const precio = parseFloat(btn.dataset.precio);
    const stock = parseInt(btn.dataset.stock);

    const cantidad = parseInt(document.getElementById('cant-' + id).value);

    agregarProductoEspecifico(id, nombre, precio, stock, cantidad);
}


    function agregarProductoEspecifico(id, nombre, precio, stock) {
        const cantidadInput = document.getElementById('cant-' + id);
        const cantidad = parseInt(cantidadInput.value);

        if (cantidad < 1 || cantidad > stock) {
            alert('Cantidad inválida');
            return;
        }

        const productoExistente = productosAgregados.find(p => p.id === id);
        if (productoExistente) {
            productoExistente.cantidad += cantidad;
            actualizarProducto(productoExistente.index);
        } else {
            const producto = {
                id: id,
                nombre: nombre,
                precio: precio,
                cantidad: cantidad,
                index: contadorProductos++
            };
            productosAgregados.push(producto);
            renderizarProducto(producto);
        }

        cantidadInput.value = 1;
        calcularTotal();
    }

    function renderizarProducto(producto) {
        const container = document.getElementById('productos-container');
        const div = document.createElement('div');
        div.id = 'producto-' + producto.index;
        div.className = 'row mb-2 align-items-center border-bottom pb-2';
        div.innerHTML = `
            <div class="col-md-4">
                <strong>${producto.nombre}</strong>
                <input type="hidden" name="detalles[${producto.index}].producto.id" value="${producto.id}">
            </div>
            <div class="col-md-2">
                <input type="number" class="form-control form-control-sm"
                       name="detalles[${producto.index}].cantidad"
                       value="${producto.cantidad}" min="1"
                       onchange="actualizarCantidad(${producto.index}, this.value)">
            </div>
            <div class="col-md-2">
                S/ ${producto.precio.toFixed(2)}
                <input type="hidden" name="detalles[${producto.index}].precioUnitario" value="${producto.precio}">
            </div>
            <div class="col-md-2">
                <strong>S/ ${(producto.cantidad * producto.precio).toFixed(2)}</strong>
            </div>
            <div class="col-md-2">
                <button type="button" class="btn btn-sm btn-danger"
                        onclick="eliminarProducto(${producto.index})">
                    <i class="bi bi-trash"></i>
                </button>
            </div>
        `;
        container.appendChild(div);
    }

    function actualizarProducto(index) {
        const producto = productosAgregados.find(p => p.index === index);
        const div = document.getElementById('producto-' + index);
        if (div && producto) {
            div.querySelector('input[name*="cantidad"]').value = producto.cantidad;
            div.querySelectorAll('strong')[1].textContent =
                'S/ ' + (producto.cantidad * producto.precio).toFixed(2);
            calcularTotal();
        }
    }

    function actualizarCantidad(index, nuevaCantidad) {
        const producto = productosAgregados.find(p => p.index === index);
        if (producto) {
            producto.cantidad = parseInt(nuevaCantidad);
            actualizarProducto(index);
        }
    }

    function eliminarProducto(index) {
        const div = document.getElementById('producto-' + index);
        if (div) {
            div.remove();
        }
        productosAgregados = productosAgregados.filter(p => p.index !== index);
        calcularTotal();
    }

    function calcularTotal() {
        let subtotal = 0;
        productosAgregados.forEach(p => {
            subtotal += p.cantidad * p.precio;
        });

        const descuento = parseFloat(document.querySelector('input[name="descuento"]').value) || 0;
        const baseImponible = subtotal - descuento;
        const igv = baseImponible * 0.18;
        const total = baseImponible + igv;

        document.getElementById('subtotal').value = subtotal.toFixed(2);
        document.getElementById('igv').value = igv.toFixed(2);
        document.getElementById('total').value = total.toFixed(2);
    }

    // Inicializar
    document.addEventListener('DOMContentLoaded', function() {
        calcularTotal();
    });
</script>
</body>
</html>
