<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
</head>
<body>
<!-- Header para Vendedor -->
<nav th:fragment="header-vendedor" class="navbar navbar-expand-lg navbar-dark py-0" style="background-color: #2b2d3d;">
    <div class="container">
        <a class="navbar-brand" href="/">
            <img style="height: 130px; width: auto;" src="/img/logo_empresa.png" alt="Logo Florería RDM">
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto align-items-center">
                <li class="nav-item"><a class="nav-link" href="/">Inicio</a></li>
                <li class="nav-item"><a class="nav-link" href="/productos">Productos</a></li>

                <!-- Menú de Ventas -->
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">
                        <i class="bi bi-cash-stack me-1"></i>Ventas
                    </a>
                    <ul class="dropdown-menu">
                        <li><a class="dropdown-item" href="/ventas/nueva">
                            <i class="bi bi-plus-circle me-2"></i>Nueva Venta
                        </a></li>
                        <li><a class="dropdown-item" href="/ventas">
                            <i class="bi bi-list-ul me-2"></i>Lista de Ventas
                        </a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li><a class="dropdown-item" href="/clientes">
                            <i class="bi bi-people me-2"></i>Clientes
                        </a></li>
                    </ul>
                </li>

                <!-- Menú de Compras -->
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">
                        <i class="bi bi-box-seam me-1"></i>Compras
                    </a>
                    <ul class="dropdown-menu">
                        <li><a class="dropdown-item" href="/compras/nueva">
                            <i class="bi bi-plus-circle me-2"></i>Nueva Compra
                        </a></li>
                        <li><a class="dropdown-item" href="/compras">
                            <i class="bi bi-list-ul me-2"></i>Lista de Compras
                        </a></li>
                    </ul>
                </li>

                <!-- Usuario Logueado -->
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle d-flex align-items-center" href="#" role="button" data-bs-toggle="dropdown">
                        <i class="bi bi-person-circle fs-5 me-2"></i>
                        <span sec:authentication="name">Vendedor</span>
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li><a class="dropdown-item" href="/perfil">
                            <i class="bi bi-person me-2"></i>Mi Perfil
                        </a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li>
                            <form th:action="@{/logout}" method="post" class="px-3">
                                <button class="btn btn-outline-danger btn-sm w-100" type="submit">
                                    <i class="bi bi-box-arrow-right me-2"></i>Cerrar Sesión
                                </button>
                            </form>
                        </li>
                    </ul>
                </li>
            </ul>
        </div>
    </div>
</nav>
</body>
</html>
