<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Mi Perfil - Florería RDM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link th:href="@{/css/styles.css}" rel="stylesheet"/>
    <link rel="icon" href="/img/logo_empresa.png" type="image/png">
</head>
<body>
    
    <div sec:authorize="hasRole('ADMIN')">
        <div th:replace="~{fragments/header-admin :: header-admin}"></div>
    </div>
    <div sec:authorize="hasRole('VENDEDOR')">
        <div th:replace="~{fragments/header-vendedor :: header-vendedor}"></div>
    </div>
    <div sec:authorize="hasRole('COMPRADOR')">
        <div th:replace="~{fragments/header-comprador :: header-comprador}"></div>
    </div>

    <div class="container mt-4 mb-5">
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="/">Inicio</a></li>
                <li class="breadcrumb-item active">Mi Perfil</li>
            </ol>
        </nav>

        <div class="row">
            <div class="col-md-3">
                <div class="card">
                    <div class="card-body text-center">
                        <div class="avatar-circle mx-auto mb-3" 
                             style="width: 120px; height: 120px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border-radius: 50%; display: flex; align-items: center; justify-content: center;">
                            <i class="bi bi-person-circle text-white" style="font-size: 80px;"></i>
                        </div>
                        <h5 class="mb-1">[[${usuario.nombreCompleto}]]</h5>
                        <p class="text-muted mb-1">@[[${usuario.username}]]</p>
                        <span class="badge" 
                              th:classappend="${usuario.rol == 'ROLE_ADMIN' ? 'bg-danger' : 
                                              usuario.rol == 'ROLE_VENDEDOR' ? 'bg-info' : 'bg-success'}">
                            <span th:text="${usuario.rol == 'ROLE_ADMIN' ? 'Administrador' : 
                                           usuario.rol == 'ROLE_VENDEDOR' ? 'Vendedor' : 'Comprador'}"></span>
                        </span>
                        
                        <div class="mt-4">
                            <div class="d-grid gap-2">
                                <a sec:authorize="hasRole('COMPRADOR')" 
                                   href="/mis-pedidos" class="btn btn-sm btn-outline-primary">
                                    <i class="bi bi-bag me-2"></i>Mis Pedidos
                                </a>
                                <a sec:authorize="hasAnyRole('ADMIN', 'VENDEDOR')" 
                                   href="/ventas" class="btn btn-sm btn-outline-primary">
                                    <i class="bi bi-cart me-2"></i>Ventas
                                </a>
                                <a sec:authorize="hasRole('ADMIN')" 
                                   href="/configuracion" class="btn btn-sm btn-outline-secondary">
                                    <i class="bi bi-gear me-2"></i>Configuración
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-md-9">
                <div th:if="${mensaje}" class="alert alert-dismissible fade show" 
                     th:classappend="${tipoMensaje != null ? 'alert-' + tipoMensaje : 'alert-success'}">
                    <i class="bi bi-check-circle me-2"></i>
                    <span th:text="${mensaje}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>

                <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
                    <i class="bi bi-exclamation-triangle me-2"></i>
                    <span th:text="${error}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>

                <div class="card mb-4">
                    <div class="card-header bg-primary text-white">
                        <i class="bi bi-person-badge me-2"></i>Información Personal
                    </div>
                    <div class="card-body">
                        <form th:action="@{/miperfil/actualizar}" method="post" th:object="${usuario}">
                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label class="form-label">Nombre de Usuario</label>
                                    <input type="text" class="form-control" th:value="${usuario.username}" readonly>
                                    <small class="text-muted">El nombre de usuario no se puede cambiar</small>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Rol</label>
                                    <input type="text" class="form-control" 
                                           th:value="${usuario.rol == 'ROLE_ADMIN' ? 'Administrador' : 
                                                      usuario.rol == 'ROLE_VENDEDOR' ? 'Vendedor' : 'Comprador'}" 
                                           readonly>
                                </div>
                            </div>

                            <div class="row mb-3">
                                <div class="col-md-12">
                                    <label class="form-label">Nombre Completo *</label>
                                    <input type="text" class="form-control" 
                                           th:field="*{nombreCompleto}" required>
                                </div>
                            </div>

                            <div class="row mb-3">
                                <div class="col-md-12">
                                    <label class="form-label">Correo Electrónico *</label>
                                    <input type="email" class="form-control" 
                                           th:field="*{email}" required>
                                </div>
                            </div>

                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label class="form-label">Tipo Documento</label>
                                    <input type="text" class="form-control"
                                           th:value="${usuario.tipoDocumento?.descripcion ?: 'N/A'}" readonly>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Número de Documento</label>
                                    <input type="text" class="form-control" 
                                           th:field="*{numeroDocumento}">
                                </div>
                            </div>

                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label class="form-label">Fecha de Ingreso</label>
                                    <input type="date" class="form-control" 
                                           th:value="${usuario.fechaIngreso}" readonly>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Estado</label>
                                    <input type="text" class="form-control" 
                                           th:value="${usuario.estado == 1 ? 'Activo' : 'Inactivo'}" readonly>
                                </div>
                            </div>

                            <hr class="my-4">

                            <h5 class="mb-3">
                                <i class="bi bi-key me-2"></i>Cambiar Contraseña
                            </h5>
                            <p class="text-muted small">Deja estos campos vacíos si no deseas cambiar tu contraseña</p>

                            <div class="row mb-3">
                                <div class="col-md-12">
                                    <label class="form-label">Contraseña Actual</label>
                                    <input type="password" class="form-control" 
                                           name="passwordActual" 
                                           placeholder="Ingresa tu contraseña actual">
                                </div>
                            </div>

                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label class="form-label">Nueva Contraseña</label>
                                    <input type="password" class="form-control" 
                                           name="passwordNuevo" 
                                           placeholder="Nueva contraseña">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Confirmar Nueva Contraseña</label>
                                    <input type="password" class="form-control" 
                                           name="passwordConfirmar" 
                                           placeholder="Confirma la nueva contraseña">
                                </div>
                            </div>

                            <div class="d-flex gap-2 mt-4">
                                <button type="submit" class="btn btn-primary">
                                    <i class="bi bi-save me-2"></i>Guardar Cambios
                                </button>
                                <a href="/" class="btn btn-outline-secondary">
                                    <i class="bi bi-x-circle me-2"></i>Cancelar
                                </a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
