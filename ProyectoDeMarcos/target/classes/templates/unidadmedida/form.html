<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Formulario Unidad</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow rounded-4 border-0">
                    <div class="card-header bg-white border-bottom-0 pt-4 text-center">
                        <h3 class="fw-bold" style="color: #2b2d3d;" 
                            th:text="${unidadMedida.idUNM != null} ? 'Editar Unidad' : 'Nueva Unidad'">
                            Gestión Unidad
                        </h3>
                    </div>
                    
                    <div class="card-body p-4">
                        <form th:action="@{/unidades}" th:object="${unidadMedida}" method="post" novalidate>
                            
                            <input type="hidden" th:field="*{idUNM}" />
                            
                            <div class="mb-3">
                                <label class="form-label fw-bold">Nombre de la Unidad</label>
                                <input type="text" class="form-control rounded-3" 
                                       th:classappend="${#fields.hasErrors('valor')} ? 'is-invalid' : ''"
                                       th:field="*{valor}" placeholder="Ej: Unidad, Kilo, Caja">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('valor')}" th:errors="*{valor}"></div>
                            </div>

                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-success btn-lg rounded-pill fw-bold">Guardar</button>
                                <a href="/unidades" class="btn btn-outline-secondary rounded-pill">Cancelar</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
