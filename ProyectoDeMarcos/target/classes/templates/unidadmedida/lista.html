<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Unidades de Medida</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link th:href="@{/css/styles.css}" rel="stylesheet"/>
    <link rel="icon" href="/img/logo_empresa.png" type="image/png">
</head>
<body class="bg-light">
  <!-- Header para usuarios NO autenticados (público) -->
<div sec:authorize="isAnonymous()">
    <div th:replace="~{fragments/header-public :: header-public}"></div>
</div>

<!-- Header para usuarios con rol COMPRADOR -->
<div sec:authorize="hasRole('COMPRADOR')">
    <div th:replace="~{fragments/header-comprador :: header-comprador}"></div>
</div>

<!-- Header para usuarios con rol VENDEDOR -->
<div sec:authorize="hasRole('VENDEDOR')">
    <div th:replace="~{fragments/header-vendedor :: header-vendedor}"></div>
</div>

<!-- Header para usuarios con rol ADMIN -->
<div sec:authorize="hasRole('ADMIN')">
    <div th:replace="~{fragments/header-admin :: header-admin}"></div>
</div>

    <div class="container mt-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="fw-bold" style="color: #2b2d3d;">Unidades de Medida</h2>
            <a class="btn btn-success text-white rounded-pill px-4" href="/unidades/nueva">
                <i class="bi bi-plus-lg me-2"></i> Nueva Unidad
            </a>
        </div>

        <div class="card shadow-sm border-0 rounded-4 overflow-hidden">
            <div class="card-body p-0">
                <table class="table table-hover mb-0">
                    <thead class="table-light">
                        <tr>
                            <th class="ps-4">ID</th>
                            <th>Valor / Nombre</th>
                            <th>Descripción</th>
                            <th class="text-end pe-4">Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="u : ${unidades}">
                            <td class="ps-4 fw-bold" th:text="${u.idUNM}">1</td>
                            <td th:text="${u.valor}">Kilo</td>
                            <td th:text="${u.descripcion}">Kilogramo</td>
                            <td class="text-end pe-4">
                                <a th:href="@{/unidades/editar/{id}(id=${u.idUNM})}" class="btn btn-sm btn-warning text-white rounded-pill me-1">
                                    <i class="bi bi-pencil-fill"></i>
                                </a>
                                <a th:href="@{/unidades/eliminar/{id}(id=${u.idUNM})}" class="btn btn-sm btn-danger rounded-pill" onclick="return confirm('¿Eliminar?');">
                                    <i class="bi bi-trash-fill"></i>
                                </a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
