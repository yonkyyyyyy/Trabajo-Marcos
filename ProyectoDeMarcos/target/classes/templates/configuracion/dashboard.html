<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Configuración</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>
    
    <div th:replace="~{fragments/header-admin :: header-admin}"></div>

    <div class="container mt-4">
        <h2><i class="bi bi-gear-fill text-primary me-2"></i>Panel de Configuración</h2>
        
        <div class="row mt-4">
            <div class="col-md-4 mb-3">
                <div class="card">
                    <div class="card-body text-center">
                        <i class="bi bi-sliders fs-1 text-primary"></i>
                        <h3>[[${totalParametros}]]</h3>
                        <p>Parámetros</p>
                        <a href="/parametros" class="btn btn-primary">Gestionar</a>
                    </div>
                </div>
            </div>
            <div class="col-md-4 mb-3">
                <div class="card">
                    <div class="card-body text-center">
                        <i class="bi bi-list-ol fs-1 text-info"></i>
                        <h3>[[${totalSeries}]]</h3>
                        <p>Series de Documentos</p>
                        <a href="/series" class="btn btn-info">Gestionar</a>
                    </div>
                </div>
            </div>
            <div class="col-md-4 mb-3">
                <div class="card">
                    <div class="card-body text-center">
                        <i class="bi bi-tags fs-1 text-success"></i>
                        <h3>[[${totalCategorias}]]</h3>
                        <p>Categorías</p>
                        <a href="/categorias" class="btn btn-success">Gestionar</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
