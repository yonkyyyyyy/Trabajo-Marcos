<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Parámetros de Empresa - Florería RDM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link th:href="@{/css/styles.css}" rel="stylesheet"/>
    <link rel="icon" href="/img/logo_empresa.png" type="image/png">
</head>
<body class="bg-light">

<div th:replace="~{fragments/header-admin :: header-admin}"></div>

<div class="container mt-4 mb-5">
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="/">Inicio</a></li>
            <li class="breadcrumb-item"><a href="/configuracion">Configuración</a></li>
            <li class="breadcrumb-item active">Parámetros de Empresa</li>
        </ol>
    </nav>

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2><i class="bi bi-building text-primary me-2"></i>Parámetros de Empresa</h2>
        <a href="/configuracion" class="btn btn-outline-secondary">
            <i class="bi bi-arrow-left me-2"></i>Volver
        </a>
    </div>

    <!-- Mensajes -->
    <div th:if="${mensaje}" class="alert alert-success alert-dismissible fade show">
        <i class="bi bi-check-circle me-2"></i>
        <span th:text="${mensaje}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
        <i class="bi bi-exclamation-triangle me-2"></i>
        <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <form th:action="@{/configuracion/parametros/guardar}" method="post" th:object="${parametros}">
        <input type="hidden" th:field="*{id}">

        <div class="row">
            <!-- Datos de la Empresa -->
            <div class="col-lg-6">
                <div class="card shadow-sm mb-4">
                    <div class="card-header bg-primary text-white">
                        <h5 class="mb-0"><i class="bi bi-building me-2"></i>Datos de la Empresa</h5>
                    </div>
                    <div class="card-body">
                        <div class="mb-3">
                            <label class="form-label fw-bold">Nombre de la Empresa *</label>
                            <input type="text" class="form-control" th:field="*{nombreEmpresa}" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">RUC *</label>
                            <input type="text" class="form-control" th:field="*{ruc}" maxlength="11">
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Dirección</label>
                            <input type="text" class="form-control" th:field="*{direccion}">
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold">Ciudad</label>
                                <input type="text" class="form-control" th:field="*{ciudad}">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold">País</label>
                                <input type="text" class="form-control" th:field="*{pais}">
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Contacto y Configuración -->
            <div class="col-lg-6">
                <div class="card shadow-sm mb-4">
                    <div class="card-header bg-success text-white">
                        <h5 class="mb-0"><i class="bi bi-telephone me-2"></i>Contacto</h5>
                    </div>
                    <div class="card-body">
                        <div class="mb-3">
                            <label class="form-label fw-bold">Teléfono</label>
                            <input type="text" class="form-control" th:field="*{telefono}">
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Email</label>
                            <input type="email" class="form-control" th:field="*{email}">
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Sitio Web</label>
                            <input type="text" class="form-control" th:field="*{sitioWeb}" placeholder="https://...">
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">URL del Logo</label>
                            <input type="text" class="form-control" th:field="*{logoUrl}" placeholder="URL de la imagen del logo">
                        </div>
                    </div>
                </div>

                <div class="card shadow-sm mb-4">
                    <div class="card-header bg-info text-white">
                        <h5 class="mb-0"><i class="bi bi-currency-dollar me-2"></i>Configuración Financiera</h5>
                    </div>
                    <div class="card-body">
                        <div class="row">
                            <div class="col-md-4 mb-3">
                                <label class="form-label fw-bold">Moneda</label>
                                <input type="text" class="form-control" th:field="*{moneda}" placeholder="S/.">
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label fw-bold">IGV (%)</label>
                                <input type="number" class="form-control" th:field="*{igv}" step="0.01" min="0" max="100">
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label fw-bold">Tipo de Cambio</label>
                                <input type="number" class="form-control" th:field="*{tipoCambio}" step="0.01">
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary btn-lg">
                <i class="bi bi-save me-2"></i>Guardar Cambios
            </button>
            <a href="/configuracion" class="btn btn-outline-secondary btn-lg">
                <i class="bi bi-x-circle me-2"></i>Cancelar
            </a>
        </div>
    </form>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
