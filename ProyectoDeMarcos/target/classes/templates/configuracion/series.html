<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Series de Documentos - Florería RDM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="icon" href="/img/logo_empresa.png" type="image/png">
    <link th:href="@{/css/styles.css}" rel="stylesheet"/>
    <link rel="icon" href="/img/logo_empresa.png" type="image/png">
</head>
<body class="bg-light">

<div th:replace="~{fragments/header-admin :: header-admin}"></div>

<div class="container mt-4 mb-5">
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="/">Inicio</a></li>
            <li class="breadcrumb-item"><a href="/configuracion">Configuración</a></li>
            <li class="breadcrumb-item active">Series de Documentos</li>
        </ol>
    </nav>

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2><i class="bi bi-file-earmark-text text-success me-2"></i>Series de Documentos</h2>
        <a href="/configuracion" class="btn btn-outline-secondary">
            <i class="bi bi-arrow-left me-2"></i>Volver
        </a>
    </div>

    <!-- Mensajes -->
    <div th:if="${mensaje}" class="alert alert-success alert-dismissible fade show">
        <i class="bi bi-check-circle me-2"></i>
        <span th:text="${mensaje}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
        <i class="bi bi-exclamation-triangle me-2"></i>
        <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="row">
        <!-- Formulario para agregar nueva serie -->
        <div class="col-lg-4">
            <div class="card shadow-sm mb-4">
                <div class="card-header bg-success text-white">
                    <h5 class="mb-0"><i class="bi bi-plus-circle me-2"></i>Nueva Serie</h5>
                </div>
                <div class="card-body">
                    <form th:action="@{/configuracion/series/guardar}" method="post">
                        <div class="mb-3">
                            <label class="form-label fw-bold">Serie *</label>
                            <input type="text" class="form-control" name="serie" 
                                   placeholder="Ej: F001, B001" required maxlength="10">
                            <small class="text-muted">Código único de la serie</small>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Tipo de Documento *</label>
                            <select class="form-select" name="tipoDocVentaId" required>
                                <option value="">Seleccionar...</option>
                                <option th:each="tipo : ${tiposDocumento}"
                                        th:value="${tipo.idVentaDoc}"
                                        th:text="${tipo.idSunat + ' - ' + tipo.descripcion}">
                                </option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Numerador Inicial</label>
                            <input type="number" class="form-control" name="numerador" 
                                   value="0" min="0">
                            <small class="text-muted">Número desde donde iniciará el correlativo</small>
                        </div>
                        <button type="submit" class="btn btn-success w-100">
                            <i class="bi bi-plus-circle me-2"></i>Agregar Serie
                        </button>
                    </form>
                </div>
            </div>
        </div>

        <!-- Lista de series -->
        <div class="col-lg-8">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white">
                    <h5 class="mb-0"><i class="bi bi-list-ul me-2"></i>Series Configuradas</h5>
                </div>
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th>Serie</th>
                                    <th>Tipo de Documento</th>
                                    <th class="text-center">Numerador Actual</th>
                                    <th class="text-center">Siguiente</th>
                                    <th class="text-center">Acciones</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="serie : ${series}">
                                    <td>
                                        <strong th:text="${serie.serie}" class="text-primary"></strong>
                                    </td>
                                    <td>
                                        <span th:if="${serie.tipoDocVenta != null}" 
                                              th:text="${serie.tipoDocVenta.descripcion}"></span>
                                        <span th:if="${serie.tipoDocVenta == null}" class="text-muted">Sin tipo</span>
                                    </td>
                                    <td class="text-center">
                                        <span class="badge bg-secondary" th:text="${serie.numerador}">0</span>
                                    </td>
                                    <td class="text-center">
                                        <span class="badge bg-success" 
                                              th:text="${serie.serie + '-' + #strings.padLeft((serie.numerador != null ? serie.numerador : 0) + 1, 8, '0')}">
                                        </span>
                                    </td>
                                    <td class="text-center">
                                        <a th:href="@{/configuracion/series/editar/{id}(id=${serie.idDocVentaCompra})}" 
                                           class="btn btn-sm btn-warning text-white" title="Editar">
                                            <i class="bi bi-pencil"></i>
                                        </a>
                                        <a th:href="@{/configuracion/series/eliminar/{id}(id=${serie.idDocVentaCompra})}" 
                                           class="btn btn-sm btn-danger" title="Eliminar"
                                           onclick="return confirm('¿Está seguro de eliminar esta serie?')">
                                            <i class="bi bi-trash"></i>
                                        </a>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(series)}">
                                    <td colspan="5" class="text-center text-muted py-4">
                                        <i class="bi bi-inbox fs-1 d-block mb-2"></i>
                                        No hay series configuradas
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
