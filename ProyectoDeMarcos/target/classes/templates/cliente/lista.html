<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Clientes - Florería RDM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light">
    
    <nav class="navbar navbar-expand-lg navbar-dark py-0" style="background-color: #2b2d3d;">
        <div class="container">
            <a class="navbar-brand" href="/">Inicio</a>
            <div class="navbar-nav">
                <a class="nav-link" href="/productos">Productos</a>
                <a class="nav-link" href="/categorias">Categorías</a>
                <a class="nav-link active fw-bold" href="/clientes">Clientes</a>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="fw-bold" style="color: #2b2d3d;">Cartera de Clientes</h2>
            <a class="btn btn-success text-white rounded-pill px-4" href="/clientes/nuevo">
                <i class="bi bi-person-plus-fill me-2"></i> Nuevo Cliente
            </a>
        </div>

        <div class="card shadow-sm border-0 rounded-4 overflow-hidden">
            <div class="card-body p-0">
                <table class="table table-hover mb-0">
                    <thead class="table-light">
                        <tr>
                            <th class="ps-4">Nombre / Razón Social</th>
                            <th>Documento</th>
                            <th>Teléfono</th>
                            <th>Correo</th>
                            <th class="text-end pe-4">Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="c : ${clientes}">
                            <td class="ps-4 fw-bold" th:text="${c.nombreRazonSocial}">Juan Perez</td>
                            <td th:text="${c.numeroDocumento}">12345678</td>
                            <td th:text="${c.telefono}">999-999-999</td>
                            <td th:text="${c.correo}">juan@mail.com</td>
                            <td class="text-end pe-4">
                                <a th:href="@{/clientes/editar/{id}(id=${c.id})}" class="btn btn-sm btn-warning text-white rounded-pill me-1"><i class="bi bi-pencil-fill"></i></a>
                                <a th:href="@{/clientes/eliminar/{id}(id=${c.id})}" class="btn btn-sm btn-danger rounded-pill" onclick="return confirm('¿Eliminar cliente?');"><i class="bi bi-trash-fill"></i></a>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(clientes)}">
                            <td colspan="5" class="text-center py-4 text-muted">No hay clientes registrados.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
