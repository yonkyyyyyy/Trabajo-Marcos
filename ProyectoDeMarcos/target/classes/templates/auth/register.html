<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Florería RDM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light d-flex align-items-center min-vh-100 py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card shadow-lg border-0 rounded-4">
                    <div class="card-body p-5">
                        <!-- Logo -->
                        <div class="text-center mb-4">
                            <img src="/img/logo_empresa.png" alt="Logo RDM" style="max-width: 120px;" class="mb-3">
                            <h3 class="fw-bold">Crear Cuenta</h3>
                            <p class="text-muted">Únete a Florería RDM</p>
                        </div>

                        <!-- Mensajes de error -->
                        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                            <i class="bi bi-exclamation-triangle me-2"></i>
                            <span th:text="${error}"></span>
                            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                        </div>

                        <!-- Formulario de Registro -->
                        <form th:action="@{/registro}" method="post" th:object="${usuario}">
                            
                            <div class="form-floating mb-3">
                                <input type="text" class="form-control rounded-3" 
                                       th:field="*{username}" 
                                       th:classappend="${#fields.hasErrors('username')} ? 'is-invalid'" 
                                       placeholder="Usuario" required>
                                <label for="username">
                                    <i class="bi bi-person me-2"></i>Nombre de Usuario
                                </label>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
                            </div>

                            <div class="form-floating mb-3">
                                <input type="email" class="form-control rounded-3" 
                                       th:field="*{email}" 
                                       th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'" 
                                       placeholder="correo@ejemplo.com" required>
                                <label for="email">
                                    <i class="bi bi-envelope me-2"></i>Correo Electrónico
                                </label>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                            </div>

                            <div class="form-floating mb-3">
                                <input type="text" class="form-control rounded-3" 
                                       th:field="*{nombreCompleto}" 
                                       th:classappend="${#fields.hasErrors('nombreCompleto')} ? 'is-invalid'" 
                                       placeholder="Nombre Completo" required>
                                <label for="nombreCompleto">
                                    <i class="bi bi-person-badge me-2"></i>Nombre Completo
                                </label>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('nombreCompleto')}" th:errors="*{nombreCompleto}"></div>
                            </div>

                            <div class="form-floating mb-3">
                                <input type="password" class="form-control rounded-3" 
                                       th:field="*{contrasena}" 
                                       th:classappend="${#fields.hasErrors('contrasena')} ? 'is-invalid'" 
                                       placeholder="Contraseña" required>
                                <label for="contrasena">
                                    <i class="bi bi-lock me-2"></i>Contraseña
                                </label>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('contrasena')}" th:errors="*{contrasena}"></div>
                                <small class="form-text text-muted">Mínimo 4 caracteres</small>
                            </div>

                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <div class="form-floating">
                                        <select class="form-select rounded-3" th:field="*{tipoDocumento.idTipoDocumento}" required>
                                            <option value="">Seleccione...</option>
                                            <option value="1">DNI</option>
                                            <option value="2">RUC</option>
                                            <option value="3">Pasaporte</option>
                                        </select>
                                        <label>Tipo Doc.</label>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="form-floating">
                                        <input type="text" class="form-control rounded-3" 
                                               th:field="*{numeroDocumento}" 
                                               th:classappend="${#fields.hasErrors('numeroDocumento')} ? 'is-invalid'" 
                                               placeholder="N° Documento" required>
                                        <label>N° Documento</label>
                                        <div class="invalid-feedback" th:if="${#fields.hasErrors('numeroDocumento')}" th:errors="*{numeroDocumento}"></div>
                                    </div>
                                </div>
                            </div>

                            <div class="form-check mb-3">
                                <input class="form-check-input" type="checkbox" id="terminos" required>
                                <label class="form-check-label small" for="terminos">
                                    Acepto los <a href="#" class="text-decoration-none">términos y condiciones</a>
                                </label>
                            </div>

                            <button class="w-100 btn btn-lg btn-primary rounded-3 mb-3" type="submit">
                                <i class="bi bi-person-plus me-2"></i>Crear Cuenta
                            </button>
                        </form>

                        <hr class="my-4">

                        <div class="text-center">
                            <p class="text-muted mb-2">¿Ya tienes cuenta?</p>
                            <a href="/login" class="btn btn-outline-primary w-100 rounded-3">
                                <i class="bi bi-box-arrow-in-right me-2"></i>Iniciar Sesión
                            </a>
                        </div>

                        <div class="text-center mt-3">
                            <a href="/" class="text-muted small">
                                <i class="bi bi-arrow-left me-1"></i>Volver al inicio
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
