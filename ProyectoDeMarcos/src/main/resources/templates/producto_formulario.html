<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuevo Producto - Florería RDM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light">

 <!-- Header para usuarios NO autenticados (público) -->
<div sec:authorize="isAnonymous()">
    <div th:replace="~{fragments/header-public :: header-public}"></div>
</div>

<!-- Header para usuarios con rol COMPRADOR -->
<div sec:authorize="hasRole('COMPRADOR')">
    <div th:replace="~{fragments/header-comprador :: header-comprador}"></div>
</div>

<!-- Header para usuarios con rol VENDEDOR -->
<div sec:authorize="hasRole('VENDEDOR')">
    <div th:replace="~{fragments/header-vendedor :: header-vendedor}"></div>
</div>

<!-- Header para usuarios con rol ADMIN -->
<div sec:authorize="hasRole('ADMIN')">
    <div th:replace="~{fragments/header-admin :: header-admin}"></div>
</div>
    <div class="container mt-5 mb-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-8">
                
                <div class="card shadow rounded-4 border-0">
                    <div class="card-header bg-white border-bottom-0 pt-4 pb-0 text-center">
                        <h2 class="fw-bold" style="color: #2b2d3d;" 
                            th:text="${producto.id != null} ? 'Editar Producto' : 'Registrar Producto'">
                            Producto
                        </h2>
                        <p class="text-muted">Ingresa los detalles del arreglo floral</p>
                    </div>
                    
                    <div class="card-body p-4">
                        <form th:action="@{/productos/guardar}" th:object="${producto}" method="post" novalidate>
                            
                            <input type="hidden" th:field="*{id}" />

                            <div class="mb-3">
                                <label for="nombre" class="form-label fw-bold">Nombre del Producto</label>
                                <input type="text" class="form-control rounded-3" 
                                       th:classappend="${#fields.hasErrors('nombre')} ? 'is-invalid' : ''"
                                       id="nombre" th:field="*{nombre}" placeholder="Ej: Ramo de Rosas Rojas">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></div>
                            </div>

                            <div class="mb-3">
                                <label for="descripcion" class="form-label fw-bold">Descripción</label>
                                <textarea class="form-control rounded-3" 
                                          th:classappend="${#fields.hasErrors('descripcion')} ? 'is-invalid' : ''"
                                          id="descripcion" th:field="*{descripcion}" rows="3" placeholder="Detalles del arreglo..."></textarea>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('descripcion')}" th:errors="*{descripcion}"></div>
                            </div>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="precio" class="form-label fw-bold">Precio (S/)</label>
                                    <input type="number" step="0.01" class="form-control rounded-3" 
                                           th:classappend="${#fields.hasErrors('precio')} ? 'is-invalid' : ''"
                                           id="precio" th:field="*{precio}" placeholder="0.00">
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('precio')}" th:errors="*{precio}"></div>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="cantidad" class="form-label fw-bold">Stock Inicial</label>
                                    <input type="number" class="form-control rounded-3" 
                                           th:classappend="${#fields.hasErrors('cantidad')} ? 'is-invalid' : ''"
                                           id="cantidad" th:field="*{cantidad}" placeholder="0">
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('cantidad')}" th:errors="*{cantidad}"></div>
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="categoriaSelect" class="form-label fw-bold">Categoría</label>
                                    <select class="form-select rounded-3" id="categoriaSelect" th:field="*{categoria}">
                                        <option value="">-- Seleccione --</option>
                                        <option th:each="cat : ${categorias}" 
                                                th:value="${cat.idCategoria}" 
                                                th:text="${cat.descripcion}">
                                        </option>
                                    </select>
                                </div>
                                
                                <div class="col-md-6 mb-3">
                                    <label for="unidadSelect" class="form-label fw-bold">Unidad de Medida</label>
                                    <select class="form-select rounded-3" id="unidadSelect" th:field="*{unidadMedida}">
                                        <option value="">-- Seleccione --</option>
                                        <option th:each="uni : ${unidades}" 
                                                th:value="${uni.idUNM}" 
                                                th:text="${uni.valor}">
                                        </option>
                                    </select>
                                </div>
                            </div>

                            <div class="mb-4">
                                <label for="imagen" class="form-label fw-bold">URL de la Imagen</label>
                                <input type="text" class="form-control rounded-3" id="imagen" th:field="*{imagen}" placeholder="https://...">
                                <div class="form-text">Copia el enlace de una imagen de internet.</div>
                            </div>

                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-success btn-lg rounded-pill fw-bold">
                                    <i class="bi bi-save me-2"></i> Guardar Producto
                                </button>
                                <a href="/productos" class="btn btn-outline-secondary rounded-pill">Cancelar</a>
                            </div>

                        </form>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
