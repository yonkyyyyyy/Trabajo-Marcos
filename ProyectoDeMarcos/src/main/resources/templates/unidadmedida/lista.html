<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Unidades de Medida</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light">
  <nav class="navbar navbar-expand-lg navbar-dark py-0" style="background-color: #2b2d3d;">
        <div class="container">
            <a class="navbar-brand" href="/">
                <img style="height: 130px; width: auto;" src="/img/logo_empresa.png" alt="Logo Florería RDM">
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-center">
                    <li class="nav-item"><a class="nav-link" href="/">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="/productos">Productos</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Nosotros</a></li>

                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                            Administración
                        </a>
                        <ul class="dropdown-menu">
                            <li><h6 class="dropdown-header">Inventario</h6></li>
                            <li><a class="dropdown-item" href="/categorias">Categorías</a></li>
                            <li><a class="dropdown-item" href="/unidades">Unidades de Medida</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><h6 class="dropdown-header">Gestión</h6></li>
                            <li><a class="dropdown-item" href="/clientes">Clientes</a></li>
                            <li><a class="dropdown-item" href="/usuarios">Usuarios</a></li>
                        </ul>
                    </li>
                    
                    <li class="nav-item mx-2">
                        <a class="nav-link" href="#">
                            <i class="bi bi-cart3 fs-5"></i>
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link btn btn-outline-light btn-sm px-3 ms-2" href="#" data-bs-toggle="modal" data-bs-target="#loginModal">Login</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="fw-bold" style="color: #2b2d3d;">Unidades de Medida</h2>
            <a class="btn btn-success text-white rounded-pill px-4" href="/unidades/nueva">
                <i class="bi bi-plus-lg me-2"></i> Nueva Unidad
            </a>
        </div>

        <div class="card shadow-sm border-0 rounded-4 overflow-hidden">
            <div class="card-body p-0">
                <table class="table table-hover mb-0">
                    <thead class="table-light">
                        <tr>
                            <th class="ps-4">ID</th>
                            <th>Valor / Nombre</th>
                            <th class="text-end pe-4">Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="u : ${unidades}">
                            <td class="ps-4 fw-bold" th:text="${u.idUNM}">1</td>
                            <td th:text="${u.valor}">Kilo</td>
                            <td class="text-end pe-4">
                                <a th:href="@{/unidades/editar/{id}(id=${u.idUNM})}" class="btn btn-sm btn-warning text-white rounded-pill me-1">
                                    <i class="bi bi-pencil-fill"></i>
                                </a>
                                <a th:href="@{/unidades/eliminar/{id}(id=${u.idUNM})}" class="btn btn-sm btn-danger rounded-pill" onclick="return confirm('¿Eliminar?');">
                                    <i class="bi bi-trash-fill"></i>
                                </a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
