<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Editar Serie - Florería RDM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="icon" href="/img/logo_empresa.png" type="image/png">
</head>
<body class="bg-light">

<div th:replace="~{fragments/header-admin :: header-admin}"></div>

<div class="container mt-4 mb-5">
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="/">Inicio</a></li>
            <li class="breadcrumb-item"><a href="/configuracion">Configuración</a></li>
            <li class="breadcrumb-item"><a href="/configuracion/series">Series</a></li>
            <li class="breadcrumb-item active">Editar Serie</li>
        </ol>
    </nav>

    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="card shadow-sm">
                <div class="card-header bg-warning text-white">
                    <h5 class="mb-0"><i class="bi bi-pencil me-2"></i>Editar Serie</h5>
                </div>
                <div class="card-body">
                    <form th:action="@{/configuracion/series/editar}" method="post" th:object="${serie}">
                        <input type="hidden" th:field="*{idDocVentaCompra}">
                        
                        <div class="mb-3">
                            <label class="form-label fw-bold">Serie *</label>
                            <input type="text" class="form-control" th:field="*{serie}" 
                                   required maxlength="10">
                            <small class="text-muted">Código único de la serie (Ej: F001, B001)</small>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label fw-bold">Tipo de Documento *</label>
                            <select class="form-select" name="tipoDocVentaId" required>
                                <option value="">Seleccionar...</option>
                                <option th:each="tipo : ${tiposDocumento}"
                                        th:value="${tipo.idVentaDoc}"
                                        th:selected="${serie.tipoDocVenta != null and serie.tipoDocVenta.idVentaDoc == tipo.idVentaDoc}"
                                        th:text="${tipo.idSunat + ' - ' + tipo.descripcion}">
                                </option>
                            </select>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label fw-bold">Numerador Actual</label>
                            <input type="number" class="form-control" th:field="*{numerador}" min="0">
                            <small class="text-muted">Modifique con cuidado - afecta los correlativos</small>
                        </div>
                        
                        <div class="alert alert-info">
                            <i class="bi bi-info-circle me-2"></i>
                            <strong>Siguiente correlativo:</strong> 
                            <span th:text="${serie.serie + '-' + #strings.padLeft((serie.numerador != null ? serie.numerador : 0) + 1, 8, '0')}"></span>
                        </div>
                        
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-warning text-white">
                                <i class="bi bi-save me-2"></i>Guardar Cambios
                            </button>
                            <a href="/configuracion/series" class="btn btn-outline-secondary">
                                <i class="bi bi-x-circle me-2"></i>Cancelar
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
