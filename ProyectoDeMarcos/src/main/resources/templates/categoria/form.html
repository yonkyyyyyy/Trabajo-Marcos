<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario Categoría</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/styles.css}" rel="stylesheet"/>
    <link rel="icon" href="/img/logo_empresa.png" type="image/png">
</head>
<body class="bg-light">

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow rounded-4 border-0">
                    <div class="card-header bg-white border-bottom-0 pt-4 text-center">
                        <h3 class="fw-bold" style="color: #2b2d3d;" 
                            th:text="${categoria.idCategoria != null} ? 'Editar Categoría' : 'Nueva Categoría'">
                            Categoría
                        </h3>
                    </div>
                    
                    <div class="card-body p-4">
                        <form th:action="@{/categorias}" th:object="${categoria}" method="post" novalidate>
                            
                            <input type="hidden" th:field="*{idCategoria}" />

                            <div class="mb-3">
                                <label class="form-label fw-bold">Descripción / Nombre</label>
                                <input type="text" class="form-control rounded-3" 
                                       th:classappend="${#fields.hasErrors('descripcion')} ? 'is-invalid' : ''"
                                       th:field="*{descripcion}" placeholder="Ej: Ramos, Cajas, Peluches">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('descripcion')}" th:errors="*{descripcion}"></div>
                            </div>

                            <div class="mb-4">
                                <label class="form-label fw-bold">Estado</label>
                                <select class="form-select rounded-3" th:field="*{estado}">
                                    <option value="1">Activo</option>
                                    <option value="0">Inactivo</option>
                                </select>
                            </div>

                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-success btn-lg rounded-pill fw-bold">Guardar</button>
                                <a href="/categorias" class="btn btn-outline-secondary rounded-pill">Cancelar</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
