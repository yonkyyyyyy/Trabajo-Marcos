<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Formulario Cliente</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/styles.css}" rel="stylesheet"/>
    <link rel="icon" href="/img/logo_empresa.png" type="image/png">
</head>
<!-- Header para usuarios NO autenticados (público) -->
<div sec:authorize="isAnonymous()">
    <div th:replace="~{fragments/header-public :: header-public}"></div>
</div>

<!-- Header para usuarios con rol COMPRADOR -->
<div sec:authorize="hasRole('COMPRADOR')">
    <div th:replace="~{fragments/header-comprador :: header-comprador}"></div>
</div>

<!-- Header para usuarios con rol VENDEDOR -->
<div sec:authorize="hasRole('VENDEDOR')">
    <div th:replace="~{fragments/header-vendedor :: header-vendedor}"></div>
</div>

<!-- Header para usuarios con rol ADMIN -->
<div sec:authorize="hasRole('ADMIN')">
    <div th:replace="~{fragments/header-admin :: header-admin}"></div>
</div>
<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow rounded-4 border-0">
                    <div class="card-header bg-white border-bottom-0 pt-4 text-center">
                        <h3 class="fw-bold" style="color: #2b2d3d;" 
                            th:text="${cliente.id != null} ? 'Editar Cliente' : 'Registrar Cliente'">
                            Cliente
                        </h3>
                    </div>
                    
                    <div class="card-body p-4">
                        <form th:action="@{/clientes/guardar}" th:object="${cliente}" method="post" novalidate>
                            
                            <input type="hidden" th:field="*{id}" />
                            
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label fw-bold">Nombre Completo</label>
                                    <input type="text" class="form-control rounded-3" 
                                           th:classappend="${#fields.hasErrors('nombreRazonSocial')} ? 'is-invalid' : ''"
                                           th:field="*{nombreRazonSocial}" placeholder="Ej: Juan Pérez">
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('nombreRazonSocial')}" th:errors="*{nombreRazonSocial}"></div>
                                </div>
                                
                                <div class="col-md-6 mb-3">
                                    <label class="form-label fw-bold">DNI / RUC</label>
                                    <input type="text" class="form-control rounded-3" 
                                           th:classappend="${#fields.hasErrors('numeroDocumento')} ? 'is-invalid' : ''"
                                           th:field="*{numeroDocumento}" placeholder="8 dígitos">
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('numeroDocumento')}" th:errors="*{numeroDocumento}"></div>
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label fw-bold">Teléfono</label>
                                    <input type="text" class="form-control rounded-3" th:field="*{telefono}" placeholder="999...">
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label fw-bold">Correo Electrónico</label>
                                    <input type="email" class="form-control rounded-3" 
                                           th:classappend="${#fields.hasErrors('correo')} ? 'is-invalid' : ''"
                                           th:field="*{correo}" placeholder="cliente@mail.com">
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('correo')}" th:errors="*{correo}"></div>
                                </div>
                            </div>

                            <div class="mb-4">
                                <label class="form-label fw-bold">Dirección</label>
                                <input type="text" class="form-control rounded-3" th:field="*{direccion}" placeholder="Av. Principal 123">
                            </div>

                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-success btn-lg rounded-pill fw-bold">Guardar Cliente</button>
                                <a href="/clientes" class="btn btn-outline-secondary rounded-pill">Cancelar</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
