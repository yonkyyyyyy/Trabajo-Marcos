<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Nueva Compra - Florería RDM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>

<!-- Header según rol -->
<div sec:authorize="hasRole('ADMIN')">
    <div th:replace="~{fragments/header-admin :: header-admin}"></div>
</div>
<div sec:authorize="hasRole('VENDEDOR')">
    <div th:replace="~{fragments/header-vendedor :: header-vendedor}"></div>
</div>

<div class="container mt-4 mb-5">
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="/">Inicio</a></li>
            <li class="breadcrumb-item"><a href="/compras">Compras</a></li>
            <li class="breadcrumb-item active">Nueva Compra</li>
        </ol>
    </nav>

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>
            <i class="bi bi-cart-plus text-primary me-2"></i>
            Nueva Compra
        </h2>
        <a href="/compras" class="btn btn-outline-secondary">
            <i class="bi bi-arrow-left me-2"></i>Volver
        </a>
    </div>

    <!-- Mensajes -->
    <div th:if="${mensaje}" class="alert alert-success alert-dismissible fade show">
        <i class="bi bi-check-circle me-2"></i>
        <span th:text="${mensaje}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
        <i class="bi bi-exclamation-triangle me-2"></i>
        <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <form th:action="@{/compras/guardar}" method="post">
        <div class="row">
            <!-- Información General -->
            <div class="col-lg-4">
                <div class="card shadow-sm mb-4">
                    <div class="card-header bg-primary text-white">
                        <h5 class="mb-0">
                            <i class="bi bi-info-circle me-2"></i>Información General
                        </h5>
                    </div>
                    <div class="card-body">
                        <!-- Proveedor -->
                        <div class="mb-3">
                            <label class="form-label fw-bold">
                                <i class="bi bi-building me-1"></i>Proveedor *
                            </label>
                            <select class="form-select" name="proveedor.id" required>
                                <option value="">Seleccionar proveedor...</option>
                                <option th:each="prov : ${proveedores}"
                                        th:value="${prov.id}"
                                        th:text="${prov.nombreRazonSocial}">
                                </option>
                            </select>
                        </div>

                        <!-- Fecha -->
                        <div class="mb-3">
                            <label class="form-label fw-bold">
                                <i class="bi bi-calendar me-1"></i>Fecha
                            </label>
                            <input type="date"
                                   class="form-control"
                                   name="fechaCompra"
                                   th:value="${#dates.format(#dates.createNow(), 'yyyy-MM-dd')}"
                                   required>
                        </div>

                        <!-- Observaciones -->
                        <div class="mb-3">
                            <label class="form-label fw-bold">
                                <i class="bi bi-chat-text me-1"></i>Observaciones
                            </label>
                            <textarea class="form-control"
                                      name="observaciones"
                                      rows="3"
                                      placeholder="Notas adicionales..."></textarea>
                        </div>
                    </div>
                </div>

                <!-- Resumen -->
                <div class="card shadow-sm">
                    <div class="card-header bg-success text-white">
                        <h5 class="mb-0">
                            <i class="bi bi-calculator me-2"></i>Resumen
                        </h5>
                    </div>
                    <div class="card-body">
                        <div class="d-flex justify-content-between mb-2">
                            <span>Subtotal:</span>
                            <strong id="resumenSubtotal">S/ 0.00</strong>
                        </div>
                        <div class="d-flex justify-content-between mb-2">
                            <span>IGV (18%):</span>
                            <strong id="resumenIGV">S/ 0.00</strong>
                        </div>
                        <hr>
                        <div class="d-flex justify-content-between">
                            <h5 class="mb-0">Total:</h5>
                            <h5 class="mb-0 text-success" id="resumenTotal">S/ 0.00</h5>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Productos -->
            <div class="col-lg-8">
                <div class="card shadow-sm">
                    <div class="card-header bg-info text-white">
                        <h5 class="mb-0">
                            <i class="bi bi-box-seam me-2"></i>Productos
                        </h5>
                    </div>
                    <div class="card-body">
                        <!-- Selector de Productos -->
                        <div class="mb-3">
                            <label class="form-label fw-bold">Agregar Producto</label>
                            <div class="row g-2">
                                <div class="col-md-6">
                                    <select id="productoSelect" class="form-select">
                                        <option value="">Seleccionar producto...</option>
                                        <option th:each="prod : ${productos}"
                                                th:value="${prod.id}"
                                                th:text="${prod.nombre + ' - S/ ' + prod.precioCompra}"
                                                th:attr="data-precio=${prod.precioCompra}, data-nombre=${prod.nombre}">
                                        </option>
                                    </select>
                                </div>
                                <div class="col-md-3">
                                    <input type="number"
                                           id="cantidadInput"
                                           class="form-control"
                                           placeholder="Cantidad"
                                           min="1"
                                           value="1">
                                </div>
                                <div class="col-md-3">
                                    <button type="button"
                                            class="btn btn-primary w-100"
                                            onclick="agregarProducto()">
                                        <i class="bi bi-plus-circle me-1"></i>Agregar
                                    </button>
                                </div>
                            </div>
                        </div>

                        <!-- Tabla de Productos -->
                        <div class="table-responsive">
                            <table class="table table-hover" id="tablaProductos">
                                <thead class="table-light">
                                <tr>
                                    <th>Producto</th>
                                    <th class="text-center">Cantidad</th>
                                    <th class="text-end">Precio Unit.</th>
                                    <th class="text-end">Subtotal</th>
                                    <th class="text-center">Acción</th>
                                </tr>
                                </thead>
                                <tbody id="productosBody">
                                <tr id="emptyRow">
                                    <td colspan="5" class="text-center text-muted">
                                        <i class="bi bi-inbox fs-1 d-block mb-2"></i>
                                        No hay productos agregados
                                    </td>
                                </tr>
                                </tbody>
                            </table>
                        </div>

                        <!-- Inputs ocultos para enviar productos -->
                        <div id="productosInputs"></div>
                    </div>
                </div>

                <!-- Botones -->
                <div class="mt-4 d-flex gap-2">
                    <button type="submit" class="btn btn-success btn-lg">
                        <i class="bi bi-save me-2"></i>Guardar Compra
                    </button>
                    <a href="/compras" class="btn btn-outline-secondary btn-lg">
                        <i class="bi bi-x-circle me-2"></i>Cancelar
                    </a>
                </div>
            </div>
        </div>
    </form>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    let productosAgregados = [];
    let contador = 0;

    function agregarProducto() {
        const select = document.getElementById('productoSelect');
        const cantidadInput = document.getElementById('cantidadInput');

        const productoId = select.value;
        const cantidad = parseInt(cantidadInput.value);

        if (!productoId) {
            alert('Seleccione un producto');
            return;
        }

        if (!cantidad || cantidad < 1) {
            alert('Ingrese una cantidad válida');
            return;
        }

        const option = select.options[select.selectedIndex];
        const nombre = option.getAttribute('data-nombre');
        const precio = parseFloat(option.getAttribute('data-precio'));

        const producto = {
            id: contador++,
            productoId: productoId,
            nombre: nombre,
            cantidad: cantidad,
            precio: precio,
            subtotal: cantidad * precio
        };

        productosAgregados.push(producto);
        renderizarProductos();
        calcularTotal();

        // Resetear
        select.value = '';
        cantidadInput.value = '1';
    }

    function renderizarProductos() {
        const tbody = document.getElementById('productosBody');
        const emptyRow = document.getElementById('emptyRow');

        if (productosAgregados.length === 0) {
            emptyRow.style.display = '';
            return;
        }

        emptyRow.style.display = 'none';

        let html = '';
        productosAgregados.forEach(prod => {
            html += `
                <tr>
                    <td><strong>${prod.nombre}</strong></td>
                    <td class="text-center">
                        <input type="number"
                               class="form-control form-control-sm text-center"
                               style="width: 80px; display: inline-block;"
                               value="${prod.cantidad}"
                               min="1"
                               onchange="actualizarCantidad(${prod.id}, this.value)">
                    </td>
                    <td class="text-end">S/ ${prod.precio.toFixed(2)}</td>
                    <td class="text-end"><strong>S/ ${prod.subtotal.toFixed(2)}</strong></td>
                    <td class="text-center">
                        <button type="button"
                                class="btn btn-sm btn-outline-danger"
                                onclick="eliminarProducto(${prod.id})">
                            <i class="bi bi-trash"></i>
                        </button>
                    </td>
                </tr>
            `;
        });

        tbody.innerHTML = html;
        actualizarInputsOcultos();
    }

    function actualizarCantidad(id, nuevaCantidad) {
        const cantidad = parseInt(nuevaCantidad);
        if (cantidad < 1) return;

        const producto = productosAgregados.find(p => p.id === id);
        if (producto) {
            producto.cantidad = cantidad;
            producto.subtotal = cantidad * producto.precio;
            renderizarProductos();
            calcularTotal();
        }
    }

    function eliminarProducto(id) {
        productosAgregados = productosAgregados.filter(p => p.id !== id);
        renderizarProductos();
        calcularTotal();
    }

    function calcularTotal() {
        const subtotal = productosAgregados.reduce((sum, p) => sum + p.subtotal, 0);
        const igv = subtotal * 0.18;
        const total = subtotal + igv;

        document.getElementById('resumenSubtotal').textContent = 'S/ ' + subtotal.toFixed(2);
        document.getElementById('resumenIGV').textContent = 'S/ ' + igv.toFixed(2);
        document.getElementById('resumenTotal').textContent = 'S/ ' + total.toFixed(2);
    }

    function actualizarInputsOcultos() {
        const container = document.getElementById('productosInputs');
        let html = '';

        productosAgregados.forEach((prod, index) => {
            html += `
                <input type="hidden" name="detalles[${index}].producto.id" value="${prod.productoId}">
                <input type="hidden" name="detalles[${index}].cantidad" value="${prod.cantidad}">
                <input type="hidden" name="detalles[${index}].precioUnitario" value="${prod.precio}">
            `;
        });

        container.innerHTML = html;
    }
</script>
</body>
</html>
