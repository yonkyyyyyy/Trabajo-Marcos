<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Florería RDM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light d-flex align-items-center min-vh-100">
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow">
                <div class="card-body p-5">

                    <!-- Logo y título -->
                    <div class="text-center mb-4">
                        <img src="/img/logo_empresa.png" alt="Logo" style="max-width: 150px;" class="mb-3">
                        <h3 class="fw-bold">Iniciar Sesión</h3>
                        <p class="text-muted">Florería RDM</p>
                    </div>

                    <!-- Mensajes -->
                    <div th:if="${error}" class="alert alert-danger alert-dismissible">
                        <i class="bi bi-exclamation-triangle me-2"></i>
                        <span th:text="${error}"></span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>

                    <div th:if="${mensaje}" class="alert alert-success alert-dismissible">
                        <i class="bi bi-check-circle me-2"></i>
                        <span th:text="${mensaje}"></span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>

                    <!-- Formulario de Login -->
                    <form th:action="@{/login}" method="post">
                        <div class="mb-3">
                            <label for="username" class="form-label">Usuario</label>
                            <input type="text" class="form-control" id="username" name="username"
                                   placeholder="Ingresa tu usuario" required autofocus>
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label">Contraseña</label>
                            <input type="password" class="form-control" id="password" name="password"
                                   placeholder="Ingresa tu contraseña" required>
                        </div>

                        <div class="form-check mb-3">
                            <input class="form-check-input" type="checkbox" name="remember-me" id="rememberMe">
                            <label class="form-check-label" for="rememberMe">
                                Recordarme
                            </label>
                        </div>

                        <button class="w-100 btn btn-primary btn-lg mb-3" type="submit">
                            <i class="bi bi-box-arrow-in-right me-2"></i>Ingresar
                        </button>
                    </form>

                    <hr>

                    <div class="text-center">
                        <p class="text-muted mb-2">¿No tienes cuenta?</p>
                        <a href="/register" class="btn btn-outline-primary w-100">
                            <i class="bi bi-person-plus me-2"></i>Crear cuenta nueva
                        </a>
                    </div>

                    <div class="text-center mt-3">
                        <a href="/" class="text-muted small">
                            <i class="bi bi-arrow-left me-1"></i>Volver al inicio
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
