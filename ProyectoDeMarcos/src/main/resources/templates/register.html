<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Florería RDM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link th:href="@{/css/styles.css}" rel="stylesheet"/>
    <link rel="icon" href="/img/logo_empresa.png" type="image/png">
</head>
<body class="bg-light d-flex align-items-center min-vh-100 py-4">
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-body p-5">

                    <!-- Logo y título -->
                    <div class="text-center mb-4">
                        <img src="/img/logo_empresa.png" alt="Logo" style="max-width: 120px;" class="mb-3">
                        <h3 class="fw-bold">Crear Cuenta</h3>
                        <p class="text-muted">Únete a Florería RDM</p>
                    </div>

                    <!-- Mensajes de error -->
                    <div th:if="${error}" class="alert alert-danger alert-dismissible">
                        <i class="bi bi-exclamation-triangle me-2"></i>
                        <span th:text="${error}"></span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>

                    <!-- Formulario de Registro -->
                    <form th:action="@{/register}" method="post" th:object="${usuario}">

                        <div class="mb-3">
                            <label for="username" class="form-label">Nombre de Usuario *</label>
                            <input type="text" class="form-control"
                                   th:field="*{username}"
                                   placeholder="Elige un nombre de usuario" required>
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label">Correo Electrónico *</label>
                            <input type="email" class="form-control"
                                   th:field="*{email}"
                                   placeholder="correo@ejemplo.com" required>
                        </div>

                        <div class="mb-3">
                            <label for="nombreCompleto" class="form-label">Nombre Completo *</label>
                            <input type="text" class="form-control"
                                   th:field="*{nombreCompleto}"
                                   placeholder="Tu nombre completo" required>
                        </div>

                        <div class="mb-3">
                            <label for="contrasena" class="form-label">Contraseña *</label>
                            <input type="password" class="form-control"
                                   th:field="*{contrasena}"
                                   placeholder="Mínimo 4 caracteres" required>
                            <small class="form-text text-muted">Mínimo 4 caracteres</small>
                        </div>

                        <div class="row mb-3">
                            <div class="col-6">
                                <label class="form-label">Tipo Documento</label>
                                <select class="form-select" th:field="*{tipoDocumento.idTipoDocumento}">
                                    <option value="1">DNI</option>
                                    <option value="2">RUC</option>
                                    <option value="3">Pasaporte</option>
                                </select>
                            </div>
                            <div class="col-6">
                                <label class="form-label">N° Documento</label>
                                <input type="text" class="form-control"
                                       th:field="*{numeroDocumento}"
                                       placeholder="12345678">
                            </div>
                        </div>

                        <div class="form-check mb-3">
                            <input class="form-check-input" type="checkbox" id="terminos" required>
                            <label class="form-check-label small" for="terminos">
                                Acepto los términos y condiciones
                            </label>
                        </div>

                        <button class="w-100 btn btn-primary btn-lg mb-3" type="submit">
                            <i class="bi bi-person-plus me-2"></i>Crear Cuenta
                        </button>
                    </form>

                    <hr>

                    <div class="text-center">
                        <p class="text-muted mb-2">¿Ya tienes cuenta?</p>
                        <a href="/login" class="btn btn-outline-primary w-100">
                            <i class="bi bi-box-arrow-in-right me-2"></i>Iniciar Sesión
                        </a>
                    </div>

                    <div class="text-center mt-3">
                        <a href="/" class="text-muted small">
                            <i class="bi bi-arrow-left me-1"></i>Volver al inicio
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
